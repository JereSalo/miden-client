# TEST WORKFLOW: publish under @jeresalo scope to validate the pipeline.
# Triggered manually via workflow_dispatch.

name: Test Publish Web Client SDK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Build native Node.js binaries for each platform
  build-native-nodejs:
    strategy:
      matrix:
        include:
          - os: macos-26
            platform-package: node-sdk-darwin-arm64
          - os: macos-26-intel
            platform-package: node-sdk-darwin-x64
          - os: ubuntu-24.04
            platform-package: node-sdk-linux-x64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Build napi binary
        run: cargo build -p miden-client-web --no-default-features --features nodejs --release

      - name: Prepare .node binary
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            EXT="dylib"
          else
            EXT="so"
          fi
          BINARY=$(find target -name "libmiden_client_web.${EXT}" -path "*/release/*" | head -1)
          if [ -z "$BINARY" ]; then
            echo "Binary not found"
            exit 1
          fi
          cp "$BINARY" "packages/${{ matrix.platform-package }}/miden_client_web.node"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform-package }}
          path: packages/${{ matrix.platform-package }}/miden_client_web.node

  # Publish all packages to npm under @jeresalo scope
  publish:
    needs: [build-native-nodejs]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Set up Rust and wasm target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: wasm32-unknown-unknown
          components: rust-src

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      # ── Publish Node.js platform packages ──
      - name: Download native binary artifacts
        if: needs.build-native-nodejs.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Sync platform package versions and publish
        if: needs.build-native-nodejs.result == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_WEBCLIENT_TOKEN }}
        run: |
          WEB_VERSION=$(jq -r '.version' crates/web-client/package.json)
          for pkg in node-sdk-darwin-arm64 node-sdk-darwin-x64 node-sdk-linux-x64-gnu; do
            cp "artifacts/${pkg}/miden_client_web.node" "packages/${pkg}/miden_client_web.node"
            jq --arg v "$WEB_VERSION" '.version = $v | .name = "@jeresalo/" + (.name | split("/")[1])' "packages/${pkg}/package.json" > /tmp/pkg.json
            mv /tmp/pkg.json "packages/${pkg}/package.json"
            echo "Publishing @jeresalo/${pkg}@${WEB_VERSION}..."
            cd "packages/${pkg}"
            npm publish --tag test --access public
            cd ../..
          done

      # ── Build and publish web-client ──
      - name: Install & build web-client
        run: |
          cd crates/web-client
          yarn install --frozen-lockfile
          yarn build

      - name: Rename package and inject Node.js optionalDependencies
        if: needs.build-native-nodejs.result == 'success'
        run: |
          cd crates/web-client
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            const v = pkg.version;
            pkg.name = '@jeresalo/miden-sdk';
            pkg.optionalDependencies = {
              '@jeresalo/node-darwin-arm64': v,
              '@jeresalo/node-darwin-x64': v,
              '@jeresalo/node-linux-x64-gnu': v,
            };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Renamed to @jeresalo/miden-sdk, injected optionalDependencies with version ' + v);
          "

      - name: Rename package (fallback if no native binaries)
        if: needs.build-native-nodejs.result != 'success'
        run: |
          cd crates/web-client
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8'));
            pkg.name = '@jeresalo/miden-sdk';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish web-client to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_WEBCLIENT_TOKEN }}
        run: |
          cd crates/web-client
          npm publish --tag test --access public

      # ── Status ──
      - name: Done
        run: echo "Published @jeresalo packages with tag 'test'."
